<!doctype html><meta charset="utf-8">
<style>
  :root{--ground:#09090b;--panel:#101013;--line:#232329;--text:#f4f4f6;--dim:#9d9da8;
        --accent:#7c7cf2;--brass:#d9a441;--steel:#7fa5c9;--neg:#f2555a}
  *{margin:0;box-sizing:border-box}
  body{width:1920px;height:1080px;background:var(--ground);color:var(--text);
       font-family:-apple-system,"Manrope",sans-serif;overflow:hidden;
       display:flex;align-items:center;justify-content:center;gap:60px}
  .half{width:820px;height:640px;background:var(--panel);border:1px solid var(--line);
        border-radius:20px;padding:44px;animation:rise .6s cubic-bezier(.2,.8,.2,1) both}
  .half.right{animation-delay:.9s}
  h2{font-size:24px;font-weight:700;letter-spacing:.1em;color:var(--dim);margin-bottom:30px}
  svg{width:100%;height:440px}
  .cap{margin-top:26px;font-size:24px;color:var(--dim);line-height:1.5}
  .frays path{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1s ease .5s forwards}
  .frays .f2{animation-delay:.8s}.frays .f3{animation-delay:1.0s}.frays .f0{animation-delay:.5s}
  .qm{opacity:0;animation:pop .4s cubic-bezier(.2,.8,.2,1) forwards}
  .q1{animation-delay:1.5s}.q2{animation-delay:1.7s}.q3{animation-delay:1.9s}
  .band path{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.1s ease 1.3s forwards}
  .band .gap{opacity:0;animation:pop .8s ease 2.2s forwards}
  @keyframes draw{to{stroke-dashoffset:0}}
  @keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
</style>
<body>
  <div class="half">
    <h2>THE USUAL APPROACH</h2>
    <svg viewBox="0 0 720 400" class="frays">
      <path class="f0" pathLength="1" d="M20 260 C 120 220, 200 300, 320 240 S 480 180, 520 200"
            stroke="var(--dim)" stroke-width="3" fill="none"/>
      <path class="f1" pathLength="1" d="M520 200 C 580 160, 630 120, 680 90"
            stroke="var(--dim)" stroke-width="2" stroke-dasharray="1" fill="none" opacity=".55"/>
      <path class="f2" pathLength="1" d="M520 200 C 585 205, 640 208, 690 205"
            stroke="var(--dim)" stroke-width="2" fill="none" opacity=".55"/>
      <path class="f3" pathLength="1" d="M520 200 C 580 250, 630 300, 680 330"
            stroke="var(--dim)" stroke-width="2" fill="none" opacity=".55"/>
      <text class="qm q1" x="695" y="100" font-size="42" fill="var(--neg)" font-weight="700">?</text>
      <text class="qm q2" x="700" y="214" font-size="42" fill="var(--neg)" font-weight="700">?</text>
      <text class="qm q3" x="695" y="342" font-size="42" fill="var(--neg)" font-weight="700">?</text>
    </svg>
    <p class="cap">Forecast the direction, buy an option pointing at the guess.</p>
  </div>
  <div class="half right">
    <h2>WHAT SKEW MEASURES</h2>
    <svg viewBox="0 0 720 400" class="band">
      <path pathLength="1" d="M20 140 C 160 120, 320 150, 480 130 S 660 120, 700 125"
            stroke="var(--brass)" stroke-width="3.5" fill="none"/>
      <path pathLength="1" d="M20 260 C 160 250, 320 280, 480 255 S 660 250, 700 252"
            stroke="var(--steel)" stroke-width="3.5" fill="none"/>
      <g class="gap">
        <line x1="360" y1="142" x2="360" y2="266" stroke="var(--accent)" stroke-width="2.5"/>
        <text x="378" y="196" font-size="30" fill="var(--text)" font-weight="700">the premium</text>
        <text x="378" y="232" font-size="22" fill="var(--dim)">implied − realized</text>
        <text x="24" y="112" font-size="22" fill="var(--brass)" font-weight="600">IMPLIED — what movement costs</text>
        <text x="24" y="304" font-size="22" fill="var(--steel)" font-weight="600">REALIZED — what movement is</text>
      </g>
    </svg>
    <p class="cap">Price the expectation against the reality, and trade the gap.</p>
  </div>
</body>
