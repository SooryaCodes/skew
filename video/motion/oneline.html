<!doctype html><meta charset="utf-8">
<style>
  :root{--ground:#09090b;--text:#f4f4f6;--accent:#7c7cf2}
  *{margin:0}body{width:1920px;height:1080px;background:var(--ground);color:var(--text);
  font-family:-apple-system,"Manrope",sans-serif;display:flex;align-items:center;justify-content:center}
  h1{font-size:110px;font-weight:800;letter-spacing:-.035em;text-align:center;
     animation:rise .8s cubic-bezier(.2,.8,.2,1) both}
  em{font-style:normal;color:var(--accent)}
  @keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
</style>
<body><h1>Direction is <em>never</em> an input.</h1></body>
