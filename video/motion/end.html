<!doctype html><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;800&display=swap" rel="stylesheet">
<style>
  /* The close: the real product mark (baked asset, never redrawn), the
     wordmark, the byline, both URLs at a size that stays legible at 720p. */
  :root { --ground:#09090b; --text:#f4f4f6; --dim:#9d9da8; }
  * { margin:0; box-sizing:border-box; }
  body { width:1920px; height:1080px; background:var(--ground); color:var(--text);
         overflow:hidden; display:flex; align-items:center; justify-content:center;
         text-align:center; }
  img.mark { width:104px; height:104px; border-radius:24px; display:block;
             margin:0 auto 30px; animation: rise .6s cubic-bezier(.2,.8,.2,1) both; }
  h1 { font-family:"Outfit", "Manrope", -apple-system, sans-serif;
       font-size:96px; font-weight:800; letter-spacing:-0.02em; line-height:1;
       animation: rise .6s cubic-bezier(.2,.8,.2,1) .1s both; }
  .by { font-family:"Outfit", "Manrope", -apple-system, sans-serif;
        font-size:30px; font-weight:600; color:var(--dim); margin-top:16px;
        animation: rise .6s cubic-bezier(.2,.8,.2,1) .2s both; }
  .urls { margin-top:52px; animation: rise .6s cubic-bezier(.2,.8,.2,1) .32s both; }
  .urls div { font-family:"Geist Mono", ui-monospace, Menlo, monospace;
              font-size:40px; font-weight:500; line-height:1.7; }
  .urls .u1 { color:var(--text); } .urls .u2 { color:var(--dim); }
  @keyframes rise { from { opacity:0; transform:translateY(12px);} to { opacity:1; transform:none;} }
</style>
<body><div>
  <img class="mark" src="assets/skew-logo-512.png" alt="">
  <h1>SKEW</h1>
  <div class="by">by Team Zevora</div>
  <div class="urls">
    <div class="u1">skew.zevora.io</div>
    <div class="u2">github.com/SooryaCodes/skew</div>
  </div>
</div></body>
