<!doctype html><meta charset="utf-8">
<style>
  :root { --ground:#09090b; --text:#f4f4f6; --dim:#9d9da8; --accent:#7c7cf2; }
  * { margin:0; box-sizing:border-box; }
  body { width:1920px; height:1080px; background:var(--ground); color:var(--text);
         font-family:-apple-system, "Manrope", sans-serif; overflow:hidden;
         display:flex; align-items:center; justify-content:center; text-align:center; }
  .mark { width:80px; height:80px; border-radius:22px; background:var(--accent);
          display:inline-flex; align-items:center; justify-content:center; margin-bottom:32px;
          animation: rise .6s cubic-bezier(.2,.8,.2,1) both; }
  h1 { font-size:72px; font-weight:800; letter-spacing:-0.03em;
       animation: rise .6s cubic-bezier(.2,.8,.2,1) .12s both; }
  .urls { margin-top:48px; animation: rise .6s cubic-bezier(.2,.8,.2,1) .28s both; }
  .urls div { font-family:"Geist Mono", ui-monospace, Menlo, monospace;
              font-size:40px; font-weight:500; line-height:1.7; }
  .urls .u1 { color:var(--text); } .urls .u2 { color:var(--dim); }
  @keyframes rise { from { opacity:0; transform:translateY(12px);} to { opacity:1; transform:none;} }
</style>
<body><div>
  <div class="mark"><svg width="48" height="48" viewBox="0 0 32 32" fill="none">
    <path d="M21.5 9.5 H15 A3.8 3.8 0 0 0 15 17.1 H17.6 A3.8 3.8 0 0 1 17.6 24.7 H10.8"
          stroke="#fff" stroke-width="3.1" stroke-linecap="round"/></svg></div>
  <h1>It does not predict the market.<br>It prices it.</h1>
  <div class="urls">
    <div class="u1">skew.zevora.io</div>
    <div class="u2">github.com/SooryaCodes/skew</div>
  </div>
</div></body>
