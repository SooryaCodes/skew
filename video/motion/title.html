<!doctype html><meta charset="utf-8">
<style>
  :root { --ground:#09090b; --text:#f4f4f6; --dim:#9d9da8; --accent:#7c7cf2; --brass:#d9a441; --steel:#7fa5c9; }
  * { margin:0; box-sizing:border-box; }
  body { width:1920px; height:1080px; background:var(--ground); color:var(--text);
         font-family:-apple-system, "Manrope", sans-serif; overflow:hidden;
         display:flex; align-items:center; justify-content:center; }
  .wrap { text-align:center; position:relative; z-index:2; }
  .mark { width:88px; height:88px; border-radius:24px; background:var(--accent);
          display:inline-flex; align-items:center; justify-content:center; margin-bottom:36px;
          animation: rise .7s cubic-bezier(.2,.8,.2,1) both; }
  h1 { font-size:88px; font-weight:800; letter-spacing:-0.035em; line-height:1.04;
       animation: rise .7s cubic-bezier(.2,.8,.2,1) .15s both; }
  p  { margin-top:28px; font-size:26px; color:var(--dim);
       animation: rise .7s cubic-bezier(.2,.8,.2,1) .3s both; }
  @keyframes rise { from { opacity:0; transform:translateY(14px);} to { opacity:1; transform:none;} }
  svg.surface { position:absolute; inset:0; width:100%; height:100%; opacity:.5; z-index:1; }
  svg.surface path { stroke-dasharray:1; stroke-dashoffset:1;
                     animation: draw 1.2s cubic-bezier(.22,1,.36,1) forwards; }
  @keyframes draw { to { stroke-dashoffset:0; } }
</style>
<body>
  <svg class="surface" viewBox="0 0 1920 1080" fill="none" preserveAspectRatio="xMidYMid slice" id="s"></svg>
  <div class="wrap">
    <div class="mark"><svg width="52" height="52" viewBox="0 0 32 32" fill="none">
      <path d="M21.5 9.5 H15 A3.8 3.8 0 0 0 15 17.1 H17.6 A3.8 3.8 0 0 1 17.6 24.7 H10.8"
            stroke="#fff" stroke-width="3.1" stroke-linecap="round"/></svg></div>
    <h1>It doesn&rsquo;t predict the market.<br>It prices it.</h1>
    <p>SKEW — an autonomous volatility desk · Alpaca paper</p>
  </div>
  <script>
    const svg = document.getElementById("s");
    for (let i = 0; i < 16; i++) {
      const t = i / 15, y = 320 + t * 640, amp = 60 + t * 90;
      const c = t > .6 ? "var(--brass)" : "var(--steel)";
      const p = document.createElementNS("http://www.w3.org/2000/svg", "path");
      p.setAttribute("d", `M-40 ${y} C 480 ${y-amp}, 900 ${y+amp*.4}, 1400 ${y-amp*.5} S 1960 ${y}, 1990 ${y-20}`);
      p.setAttribute("stroke", c); p.setAttribute("stroke-width", t > .6 ? 2 : 1.2);
      p.setAttribute("pathLength", "1"); p.setAttribute("opacity", .25 + t*.55);
      p.style.animationDelay = `${t * 0.9}s`;
      svg.appendChild(p);
    }
  </script>
</body>
